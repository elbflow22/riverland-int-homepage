<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Seite nicht gefunden · Riverland International GmbH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #004FFF;
    --ink: #0A0E1A;
    --ink-soft: #4A5060;
    --paper: #FAFAF7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter Tight', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
  }
  .wrap { text-align: center; max-width: 520px; }
  .code {
    font-family: 'Fraunces', serif;
    font-size: clamp(80px, 18vw, 160px);
    font-weight: 300;
    line-height: 1;
    color: var(--brand);
    letter-spacing: -0.04em;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(24px, 4vw, 32px);
    margin: 24px 0 16px;
    letter-spacing: -0.02em;
  }
  p { color: var(--ink-soft); margin-bottom: 32px; }
  a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--ink);
    color: var(--paper);
    text-decoration: none;
    padding: 14px 24px;
    border-radius: 100px;
    font-weight: 500;
    font-size: 14px;
    transition: background 0.25s;
  }
  a:hover { background: var(--brand); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Vielleicht haben Sie sich verlaufen — oder die Seite wurde verschoben.</p>
    <a href="/">Zur Startseite</a>
  </div>
</body>
</html>
